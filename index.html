<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lakewood Footprint & Parcel Mapper</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1c1a17;
      --panel-card: #25221e;
      --accent-green: #52b788;
      --accent-green-hover: #40916c;
      --accent-red: #A23A2C;
      --text-main: #f0f0f0;
      --text-muted: #d4c5b9;
      --ink-faint: #888078;
      --border-color: #332f2b;
      --input-bg: #141311;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }

    #sidebar {
      width: 380px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 2;
      box-shadow: -2px 0 10px rgba(0,0,0,0.5);
    }

    .sidebar-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .section {
      margin-bottom: 20px;
      background: var(--panel-card);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    input[type="number"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    .btn {
      width: 100%;
      padding: 11px 15px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .btn.primary {
      background-color: #88b0a0;
      color: #121212;
    }

    .btn.primary:hover {
      background-color: var(--accent-green);
    }

    .btn.secondary {
      background-color: #2b2723;
      color: #f0f0f0;
      border: 1px solid var(--border-color);
    }

    .btn.secondary:hover {
      background-color: #38332e;
    }

    .status-box {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .stat-display {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin: 4px 0;
    }

    .stat-display span {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .badge-success {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(82, 183, 136, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .popup-flagged {
      color: #121212;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .popup-flagged .btn {
      margin-top: 8px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <div class="sidebar-content">
      
      <!-- Threshold Section -->
      <div class="section">
        <label for="threshold-input">Minimum sq ft to flag</label>
        <input type="number" id="threshold-input" value="10000" step="500">
      </div>

      <!-- Auto-Detect Section -->
      <div class="section">
        <div class="section-title">AUTO-DETECT BUILDINGS (JEFFCO ASSESSOR DATA)</div>
        <p class="status-box" style="margin-bottom: 12px;">
          Queries Jefferson County's parcel feed for recorded building sizes and flags anything at or above your threshold.
        </p>
        <button class="btn primary" id="scan-btn">Scan current view for buildings</button>
        <div id="scan-status" class="status-box" style="margin-top: 10px;"></div>
      </div>

      <!-- Tracing Controls Section -->
      <div class="section">
        <div class="section-title">TRACING</div>
        <p id="trace-status" class="status-box" style="margin-bottom: 12px;">
          Click points on the map to manually trace a custom footprint shape.
        </p>
        <div style="display: flex; gap: 10px;">
          <button class="btn secondary" id="undo-btn">Undo point</button>
          <button class="btn primary" id="finish-btn">Finish shape</button>
        </div>
      </div>

      <!-- Current Trace Stats Section -->
      <div class="section">
        <div class="section-title">CURRENT TRACE</div>
        <div id="trace-area" class="stat-display">0 <span>sq ft</span></div>
        <div id="trace-metric" class="status-box" style="margin-bottom: 8px;">0 m²</div>
        <div id="trace-badge"></div>
        
        <div style="margin-top: 16px;">
          <label for="address-input">Address / label</label>
          <input type="text" id="address-input" placeholder="matches search above">
        </div>
      </div>

    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map centered on Lakewood, CO
    var map = L.map('map').setView([39.7150, -105.1320], 16);

    // Light basemap theme
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // Feature Overlay Groups
    var scanGroup = L.featureGroup().addTo(map);
    var drawGroup = L.featureGroup().addTo(map);

    // Manual Tracing State
    var activePoints = [];
    var activePolyline = null;
    var activePolygon = null;

    // --- Fixed Auto-Detect Scan Function ---
    function scanVisibleArea() {
      var statusEl = document.getElementById('scan-status');
      var b = map.getBounds();
      var threshold = parseFloat(document.getElementById('threshold-input').value) || 0;

      statusEl.textContent = 'Querying Jefferson County building footprints...';
      scanGroup.clearLayers();

      var baseUrl = 'https://services2.arcgis.com/839z1P1Sg5R636Y3/arcgis/rest/services/Jefferson_County_Parcels/FeatureServer/20/query';
      
      // Construct Bounding Box Geometry Envelope
      var bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
      
      // Fully encoded URL string to fix "Invalid URL" error
      var fullUrl = baseUrl + 
        '?where=' + encodeURIComponent('STTGRSAREA>=' + threshold) +
        '&geometry=' + encodeURIComponent(bbox) +
        '&geometryType=esriGeometryEnvelope' +
        '&inSR=4326' +
        '&spatialRel=esriSpatialRelIntersects' +
        '&outFields=' + encodeURIComponent('PIN,PARCELID,PRPADDRESS,STTYRBLT,STTTYPUSE,STTGRSAREA,OWNNAM') +
        '&returnGeometry=true' +
        '&outSR=4326' +
        '&f=json';

      fetch(fullUrl)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          if (data.error) throw new Error(data.error.message || 'ArcGIS Query Error');
          var features = data.features || [];

          if (features.length === 0) {
            statusEl.textContent = 'Scan complete: No footprints found matching ≥ ' + threshold.toLocaleString() + ' sq ft in this exact view.';
            return;
          }

          var count = 0;
          features.forEach(function (f) {
            if (!f.geometry) return;

            var latlngs = [];
            if (f.geometry.rings) {
              latlngs = f.geometry.rings[0].map(function(pt) { return [pt[1], pt[0]]; });
            } else if (f.geometry.coordinates) {
              latlngs = f.geometry.coordinates[0].map(function(pt) { return [pt[1], pt[0]]; });
            }

            if (latlngs.length === 0) return;
            count++;

            var attrs = f.attributes || {};
            var sqft = attrs.STTGRSAREA || 0;
            var addr = (attrs.PRPADDRESS || 'Unknown Address').trim();

            var poly = L.polygon(latlngs, {
              color: '#A23A2C',
              fillColor: '#A23A2C',
              weight: 2,
              fillOpacity: 0.4
            }).addTo(scanGroup);

            var popupDiv = document.createElement('div');
            popupDiv.className = 'popup-flagged';
            popupDiv.innerHTML =
              '<strong>' + Math.round(sqft).toLocaleString() + ' sq ft</strong><br>' +
              addr + '<br>' +
              '<span style="font-size:11px; color:#666;">Built ' + (attrs.STTYRBLT || 'N/A') + ' · ' + (attrs.STTTYPUSE || '') + '</span><br>';

            var btn = document.createElement('button');
            btn.className = 'btn primary';
            btn.textContent = 'Add to my list';
            btn.addEventListener('click', function () {
              commitEntry(
                latlngs.map(function(ll) { return { lat: ll[0], lng: ll[1] }; }),
                addr,
                'Assessor data (PIN: ' + (attrs.PIN || 'N/A') + ')'
              );
              poly.closePopup();
            });
            popupDiv.appendChild(btn);
            poly.bindPopup(popupDiv);
          });

          statusEl.textContent = 'Scan complete. Found ' + count + ' structure(s) ≥ ' + threshold.toLocaleString() + ' sq ft.';
        })
        .catch(function (err) {
          statusEl.textContent = 'Scan error: ' + err.message + '. (Try zooming in slightly closer or panning to refresh).';
        });
    }

    // --- Interactive Map Click Tracing ---
    map.on('click', function(e) {
      activePoints.push(e.latlng);
      updateTracingDisplay();
    });

    map.on('dblclick', function(e) {
      if (activePoints.length >= 3) {
        var addr = document.getElementById('address-input').value || 'Manual Trace';
        commitEntry(activePoints, addr, 'Manual Trace');
        activePoints = [];
        updateTracingDisplay();
      }
    });

    function updateTracingDisplay() {
      if (activePolyline) map.removeLayer(activePolyline);
      if (activePolygon) map.removeLayer(activePolygon);

      var count = activePoints.length;
      var traceStatus = document.getElementById('trace-status');

      if (count === 0) {
        traceStatus.textContent = 'Click points on the map to manually trace a custom footprint shape.';
        document.getElementById('trace-area').innerHTML = '0 <span>sq ft</span>';
        document.getElementById('trace-metric').textContent = '0 m²';
        document.getElementById('trace-badge').innerHTML = '';
        return;
      }

      if (count < 3) {
        traceStatus.textContent = count + ' point(s) placed. Click at least 3 points to create a polygon.';
        activePolyline = L.polyline(activePoints, { color: '#52b788', weight: 3 }).addTo(map);
        document.getElementById('trace-area').innerHTML = '0 <span>sq ft</span>';
        document.getElementById('trace-metric').textContent = '0 m²';
        document.getElementById('trace-badge').innerHTML = '';
      } else {
        traceStatus.textContent = count + ' points placed. Keep going, or click Finish shape / double-click the map.';
        activePolygon = L.polygon(activePoints, { color: '#52b788', fillColor: '#52b788', fillOpacity: 0.35, weight: 2 }).addTo(map);
        
        var sqMeters = calculatePolygonArea(activePoints);
        var sqFt = sqMeters * 10.7639;
        
        document.getElementById('trace-area').innerHTML = Math.round(sqFt).toLocaleString() + ' <span>sq ft</span>';
        document.getElementById('trace-metric').textContent = Math.round(sqMeters).toLocaleString() + ' m²';

        var threshold = parseFloat(document.getElementById('threshold-input').value) || 0;
        if (sqFt >= threshold) {
          document.getElementById('trace-badge').innerHTML = '<span class="badge-success">✓ at or above ' + threshold.toLocaleString() + ' sq ft</span>';
        } else {
          document.getElementById('trace-badge').innerHTML = '';
        }
      }
    }

    // Geodesic Area Calculation Algorithm
    function calculatePolygonArea(latLngs) {
      if (latLngs.length < 3) return 0;
      var radius = 6378137;
      var area = 0;

      for (var i = 0; i < latLngs.length; i++) {
        var p1 = latLngs[i];
        var p2 = latLngs[(i + 1) % latLngs.length];
        area += (p2.lng - p1.lng) * (Math.PI / 180) * (2 + Math.sin(p1.lat * (Math.PI / 180)) + Math.sin(p2.lat * (Math.PI / 180)));
      }
      area = area * radius * radius / 2.0;
      return Math.abs(area);
    }

    function commitEntry(coords, label, source) {
      L.polygon(coords, { color: '#52b788', fillColor: '#52b788', fillOpacity: 0.5, weight: 2 }).addTo(drawGroup);
      alert('Saved shape for: ' + (label || 'Unlabeled shape'));
    }

    // Event Listeners
    document.getElementById('scan-btn').addEventListener('click', scanVisibleArea);

    document.getElementById('undo-btn').addEventListener('click', function() {
      activePoints.pop();
      updateTracingDisplay();
    });

    document.getElementById('finish-btn').addEventListener('click', function() {
      if (activePoints.length < 3) {
        alert('Please click at least 3 points on the map before finishing a shape.');
        return;
      }
      var addr = document.getElementById('address-input').value || 'Manual Trace';
      commitEntry(activePoints, addr, 'Manual Trace');
      activePoints = [];
      updateTracingDisplay();
    });

  </script>
</body>
</html>
